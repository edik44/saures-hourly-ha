            period: day
          color_threshold:
            - value: 0
              color: '#7dd3fc'
            - value: 0.3
              color: '#38bdf8'
            - value: 0.6
              color: '#0ea5e9'
            - value: 0.9
              color: '#6366f1'
      apex_config:
        noData:
          text: 'Вода по дням: нет данных синхронизации'
        chart:
          height: 160
          toolbar:
            show: false
        tooltip:
          x:
            format: dd MMM
        xaxis:
          type: datetime
          labels:
            format: dd MMM
            style:
              colors: 'rgba(255, 255, 255, 0.65)'
              fontSize: '11px'
        yaxis:
          - decimalsInFloat: 2
        grid:
          show: false
        legend:
          show: false
        dataLabels:
          enabled: false
        plotOptions:
          bar:
            columnWidth: 70%
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04)) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 14px;
            margin: 3px 6px !important;
            box-shadow:
              0 5.5px 11px rgba(0, 0, 0, 0.35),
              0 1.5px 3px rgba(0, 0, 0, 0.28),
              inset 0 1px 0 rgba(255, 255, 255, 0.20),
              inset 0 -1.5px 3px rgba(0, 0, 0, 0.18) !important;
            overflow: hidden;
          }
  # «День», ₽
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.vid_grafika_vody
        state: day
      - condition: state
        entity: input_boolean.pokazyvat_raskhod_vody_v_rubliakh
