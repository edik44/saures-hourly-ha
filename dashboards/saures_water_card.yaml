          }
  # «Месяц», м³: последние 12 месяцев и серые столбцы год назад
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.vid_grafika_vody
        state: month
      - condition: state
        entity: input_boolean.pokazyvat_raskhod_vody_v_rubliakh
        state_not: 'on'
    card:
      type: custom:apexcharts-card
      header:
        show: false
      graph_span: 365d
      span:
        end: month
      series:
        - entity: sensor.voda_saures_raskhod
          name: Расход
          type: column
          unit: м³
          float_precision: 2
          color: '#38bdf8'
          statistics:
            type: change
            period: month
        - entity: sensor.voda_saures_raskhod
          name: Год назад
          type: column
          unit: м³
          float_precision: 2
          offset: -365d
          color: '#9e9e9e'
          opacity: 0.5
          statistics:
            type: change
            period: month
      apex_config:
        noData:
          text: 'Вода по месяцам: нет данных синхронизации'
        chart:
          height: 160
          toolbar:
            show: false
        tooltip:
          x:
            format: MMMM yyyy
        xaxis:
          type: datetime
          labels:
            format: MMM yy
            style:
              colors: 'rgba(255, 255, 255, 0.65)'
              fontSize: '11px'
        yaxis:
          - decimalsInFloat: 1
        grid:
          show: false
        legend:
          show: false
        dataLabels:
          enabled: false
        plotOptions:
          bar:
            columnWidth: 60%
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04)) !important;
