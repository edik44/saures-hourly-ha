              color: '#7dd3fc'
            - value: 20
              color: '#38bdf8'
            - value: 40
              color: '#0ea5e9'
            - value: 60
              color: '#6366f1'
      apex_config:
        noData:
          text: '₽ по дням: нет данных синхронизации'
        chart:
          height: 160
          toolbar:
            show: false
        tooltip:
          x:
            format: dd MMM
        xaxis:
          type: datetime
          labels:
            format: dd MMM
            style:
              colors: 'rgba(255, 255, 255, 0.65)'
              fontSize: '11px'
        yaxis:
          - decimalsInFloat: 0
        grid:
          show: false
        legend:
          show: false
        dataLabels:
          enabled: false
        plotOptions:
          bar:
            columnWidth: 70%
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04)) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 14px;
            margin: 3px 6px !important;
