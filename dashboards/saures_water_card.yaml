          float_precision: 0
          offset: -365d
          color: '#9e9e9e'
          opacity: 0.5
          statistics:
            type: change
            period: month
      apex_config:
        noData:
          text: '₽ по месяцам: нет данных синхронизации'
        chart:
          height: 160
          toolbar:
            show: false
        tooltip:
          x:
            format: MMMM yyyy
        xaxis:
          type: datetime
          labels:
            format: MMM yy
            style:
              colors: 'rgba(255, 255, 255, 0.65)'
              fontSize: '11px'
        yaxis:
          - decimalsInFloat: 0
        grid:
          show: false
        legend:
          show: false
        dataLabels:
          enabled: false
        plotOptions:
          bar:
            columnWidth: 60%
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04)) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 14px;
            margin: 3px 6px !important;
            box-shadow:
              0 5.5px 11px rgba(0, 0, 0, 0.35),
              0 1.5px 3px rgba(0, 0, 0, 0.28),
              inset 0 1px 0 rgba(255, 255, 255, 0.20),
              inset 0 -1.5px 3px rgba(0, 0, 0, 0.18) !important;
            overflow: hidden;
          }
card_mod:
  style: |
    ha-card {
      padding: 4px 0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      overflow: visible;
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
      transition: box-shadow 0.3s ease;
    }
grid_options:
  rows: auto
  columns: 12
