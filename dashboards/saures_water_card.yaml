        state: 'on'
    card:
      type: custom:apexcharts-card
      header:
        show: false
      graph_span: 365d
      span:
        end: month
      series:
        - entity: sensor.voda_saures_stoimost
          name: Расход
          type: column
          unit: ₽
          float_precision: 0
          color: '#38bdf8'
          statistics:
            type: change
            period: month
